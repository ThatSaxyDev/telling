name: telling
description: "An analytics dashboard built with Flutter. This application serves as the command center for monitoring logs, events, and crashes sent from the `telling_logger` SDK."
publish_to: 'none'

version: 1.0.0+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  telling_logger: ^1.2.2
  http: ^1.6.0
  go_router: ^17.0.0
  flutter_riverpod: ^3.0.3
  responsive_framework: ^1.5.1
  google_fonts: ^6.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.5
  flutter_highlighter: ^0.1.1
  markdown: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  freezed: ^3.2.3
  build_runner: ^2.4.13
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launchericon.png"
  min_sdk_android: 21


flutter_native_splash:
  color: "#000000" 
  image: "assets/images/launchericon.png"
  icon_background_color: "#000000" 
  fullscreen: false
  android: true
  ios: true
  
  android_12:
    image: "assets/images/launchericon.png"
    icon_background_color: "#000000"
    image_dark: "assets/images/launchericon.png"
    icon_background_color_dark: "#000000"

flutter:

  uses-material-design: true


  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/syne/Syne-Regular.ttf
        - asset: assets/fonts/syne/Syne-Medium.ttf
          weight: 500
        - asset: assets/fonts/syne/Syne-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/syne/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/syne/Syne-ExtraBold.ttf
          weight: 800
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Thin.ttf
          weight: 100
        - asset: assets/fonts/urbanist/Urbanist-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/urbanist/Urbanist-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Light.ttf
          weight: 300
        - asset: assets/fonts/urbanist/Urbanist-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
        - asset: assets/fonts/urbanist/Urbanist-Italic.ttf
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/urbanist/Urbanist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/urbanist/Urbanist-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/urbanist/Urbanist-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/urbanist/Urbanist-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Black.ttf
          weight: 900
        - asset: assets/fonts/urbanist/Urbanist-BlackItalic.ttf
          weight: 900
          style: italic
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/sourceCodePro/SourceCodePro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/sourceCodePro/SourceCodePro-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Light.ttf
          weight: 300
        - asset: assets/fonts/sourceCodePro/SourceCodePro-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Regular.ttf
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Italic.ttf
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Medium.ttf
          weight: 500
        - asset: assets/fonts/sourceCodePro/SourceCodePro-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sourceCodePro/SourceCodePro-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Bold.ttf
          weight: 700
        - asset: assets/fonts/sourceCodePro/SourceCodePro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/sourceCodePro/SourceCodePro-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/sourceCodePro/SourceCodePro-Black.ttf
          weight: 900
        - asset: assets/fonts/sourceCodePro/SourceCodePro-BlackItalic.ttf
          weight: 900
          style: italic

  assets:
    - assets/images/
    - assets/docs/
    - assets/docs/sections/
