<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Telling - Advanced error tracking and analytics for Flutter applications.">
  <meta name="keywords" content="Flutter, Error Tracking, Analytics, Logging, Telling, Monitoring">
  <meta name="author" content="Telling">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Telling - Error Tracking & Analytics">
  <meta property="og:description" content="Advanced error tracking and analytics for Flutter applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Telling">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Telling - Error Tracking & Analytics</title>
  <link rel="manifest" href="manifest.json">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0A0A0A;
    overflow: hidden;
  }

  #loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
  }

  #loading-screen.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .loading-content {
    text-align: center;
  }

  .loading-logo {
    font-size: 48px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 32px;
    letter-spacing: 2px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .loading-bar {
    width: 300px;
    height: 4px;
    background: rgba(76, 175, 80, 0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .loading-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #4CAF50, #81C784);
    border-radius: 2px;
    animation: slide 1.5s ease-in-out infinite;
    box-shadow:
      0 0 10px rgba(76, 175, 80, 0.8),
      0 0 20px rgba(76, 175, 80, 0.5);
  }

  @keyframes slide {
    0% {
      transform: translateX(-100%);
    }

    100% {
      transform: translateX(350%);
    }
  }

  @media (max-width: 768px) {
    .loading-logo {
      font-size: 36px;
    }

    .loading-bar {
      width: 200px;
      height: 3px;
    }
  }
</style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">TELLING</div>
      <div class="loading-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.classList.add('hidden');

      // Remove from DOM after transition
      setTimeout(() => {
        loadingScreen.remove();
      }, 600);
    });

    // Fallback: hide after 5 seconds if Flutter doesn't load
    setTimeout(() => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
        setTimeout(() => {
          loadingScreen.remove();
        }, 600);
      }
    }, 5000);
  </script>
</body>
</html>
