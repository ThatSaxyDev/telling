<head>

<!-- Pusher JS for real-time updates -->
<script charset="utf-8" src="https://js.pusher.com/8.3.0/pusher.min.js"></script>

<style>
  /* ─────────────────────────────────────────────────────────────────────────
     Telling loader.

     This paints before Flutter boots, so it cannot use the app's widgets.
     Three things it does that the previous loader did not:

       1. Real progress. Flutter's loader reports actual download progress via
          onProgress, so the bar tracks bytes rather than sweeping forever.
       2. The real brand fonts. Syne and Urbanist ship inside the Flutter asset
          bundle, so @font-face points at the same TTFs the app uses — no Google
          Fonts request, no extra bytes, no flash of system fallback.
       3. The app's palette: near-black, white, Flutter blue, and DartNative's
          spectrum. The old loader used a green that appeared nowhere else.
     ───────────────────────────────────────────────────────────────────────── */

  @font-face {
    font-family: 'Syne';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('assets/assets/fonts/syne/Syne-SemiBold.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Urbanist';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('assets/assets/fonts/urbanist/Urbanist-SemiBold.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Urbanist';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('assets/assets/fonts/urbanist/Urbanist-Regular.ttf') format('truetype');
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0A0A0A;
    overflow: hidden;
  }

  #loading-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    z-index: 9999;
    background: #0A0A0A;
    transition: opacity 0.55s ease, visibility 0.55s ease;
  }

  #loading-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Fine grid, matching the app's GridBackground. */
  #loading-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  /* Scanline, matching the app's Scanline overlay. */
  #loading-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(0, 0, 0, 0.16) 3px,
      rgba(0, 0, 0, 0.16) 4px
    );
    pointer-events: none;
  }

  .loading-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .loading-tagline {
    font-family: 'Urbanist', sans-serif;
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.34em;
    color: #5C5C61;
    text-transform: uppercase;
    text-indent: 0.34em;
  }

  /* Angular, because the app theme is BorderRadius.zero throughout. */
  .loading-track {
    position: relative;
    width: min(320px, 62vw);
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .loading-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    /* Sweeps both SDK colours: Flutter blue into DartNative's spectrum. */
    background: linear-gradient(
      90deg,
      #02569B 0%,
      #54C5F8 34%,
      #fa60a6 56%,
      #f9d126 76%,
      #b5c75e 88%,
      #03c3f0 100%
    );
    transition: width 0.25s ease-out;
  }

  /* Indeterminate only until Flutter's first real progress event arrives. */
  .loading-track.indeterminate .loading-fill {
    width: 38%;
    animation: dl-sweep 1.1s ease-in-out infinite;
  }

  @keyframes dl-sweep {
    0% { transform: translateX(-105%); }
    100% { transform: translateX(300%); }
  }

  .loading-meta {
    display: flex;
    align-items: baseline;
    justify-content: center;
    width: min(320px, 62vw);
    font-family: 'Urbanist', sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: #4A4A4E;
    text-transform: uppercase;
  }

  /* The hero now carries both SDKs; the loader previews them. Each chip fills
     with its own brand colour once real progress clears 55%. */
  .loading-sdks {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .sdk-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-family: 'Urbanist', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #6B6B70;
    text-transform: uppercase;
    transition: color 0.4s ease, border-color 0.4s ease;
  }

  .sdk-chip .dot {
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.16);
    transition: background 0.4s ease;
  }

  .sdk-chip.flutter.lit {
    color: #54C5F8;
    border-color: rgba(2, 86, 155, 0.85);
  }
  .sdk-chip.flutter.lit .dot { background: #54C5F8; }

  .sdk-chip.dartnative.lit {
    color: #E8E8EA;
    border-color: rgba(249, 209, 38, 0.55);
    background-image: linear-gradient(
      100deg,
      rgba(250, 96, 166, 0.16),
      rgba(249, 209, 38, 0.16),
      rgba(3, 195, 240, 0.16)
    );
  }
  .sdk-chip.dartnative.lit .dot {
    background: linear-gradient(120deg, #fa60a6, #f9d126, #03c3f0);
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-track.indeterminate .loading-fill {
      width: 100%;
      animation: none;
      opacity: 0.55;
    }
    #loading-screen,
    .loading-fill,
    .sdk-chip,
    .sdk-chip .dot {
      transition: none;
    }
  }
</style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-tagline">Telling</div>
      <div class="loading-track indeterminate">
        <div class="loading-fill"></div>
      </div>
      <div class="loading-meta">
        <span class="loading-status">Initialising</span>
      </div>
    </div>
    <div class="loading-sdks">
      <div class="sdk-chip flutter lit"><span class="dot"></span>Flutter</div>
      <div class="sdk-chip dartnative lit"><span class="dot"></span>DartNative</div>
    </div>
  </div>

  <script>
    (function () {
      var screenEl = document.getElementById('loading-screen');
      var trackEl = screenEl.querySelector('.loading-track');
      var fillEl = screenEl.querySelector('.loading-fill');
      var statusEl = screenEl.querySelector('.loading-status');
      var hidden = false;
      var reported = 0;

      function paint(pct, status) {
        if (pct <= reported) return;
        reported = pct;
        trackEl.classList.remove('indeterminate');
        fillEl.style.width = pct + '%';
        if (status) statusEl.textContent = status;
      }

      // The bar sweeps until Flutter paints its first frame. Flutter's
      // onProgress only fires on the dart2wasm path; this app compiles to
      // dart2js, so the sweep simply runs until the app is ready.
      function hide() {
        if (hidden) return;
        hidden = true;
        paint(100, 'Ready');
        screenEl.classList.add('hidden');
        setTimeout(function () { screenEl.remove(); }, 700);
      }

      window.addEventListener('flutter-first-frame', hide);

      // Custom bootstrap. The two tokens below are replaced textually and must
      // sit on their own lines -- never name one inside a comment, or the whole
      // inlined payload gets swallowed by that comment.
      {{flutter_js}}
      {{flutter_build_config}}

      _flutter.loader.load({
        onProgress: function (e) {
          // Ignore zero: that is a "started" event, not progress.
          var fraction = 0;
          if (typeof e === 'number') fraction = e;
          else if (e && e.loaded !== undefined && e.total) fraction = e.loaded / e.total;
          if (fraction > 0) paint(Math.round(fraction * 100));
        },
      });

      // Safety net, not a blunt 5s timer: only intervene if Flutter has not
      // painted after 20s, and never yank a healthy load early.
      setTimeout(function () {
        if (!hidden) statusEl.textContent = 'Still loading — check your connection';
      }, 20000);
    })();
  </script>
</body>
</html>
